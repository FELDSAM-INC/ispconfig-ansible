# A new PHP 5.3 build when the sources, build script, security patch/checks or paths change.
ispconfig_php53_build_id: >-
  {{ [ispconfig_php53_sources.php.sha256, ispconfig_php53_sources.openssl.sha256, ispconfig_php53_sources.curl.sha256,
      ispconfig_php53_sources.libxml2.sha256, ispconfig_php53_sources.libxslt.sha256,
      lookup('ansible.builtin.file', 'build-php53.sh') | hash('sha256'),
      lookup('ansible.builtin.file', 'php-5.3.29-bailout.patch') | hash('sha256'),
      lookup('ansible.builtin.file', 'verify-php53-security.sh') | hash('sha256'),
      ispconfig_php53_prefix, ispconfig_php53_config_dir]
     | join(' ') | hash('sha256') }}
