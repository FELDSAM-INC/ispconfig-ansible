# Database server: ISPConfig with MariaDB for customer databases. MariaDB listens on all addresses
# (ispconfig_mariadb_bind_address); ISPConfig grants each database to the addresses of its website's web server.
- name: ISPConfig
  ansible.builtin.include_role:
    name: ispconfig_server

# Sized from the server's RAM, see defaults/main.yml. mariadbd checks every option before the file is installed, so
# a setting the installed MariaDB does not know never keeps it from starting.
- name: MariaDB settings for customer databases
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/91-ispconfig-db.cnf
    owner: root
    group: root
    mode: "0644"
    validate: mariadbd --defaults-file=%s --help --verbose
  register: ispconfig_db_mariadb_config

- name: Directory of the mariadb service's drop-ins
  ansible.builtin.file:
    path: /etc/systemd/system/mariadb.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Open-files limit of MariaDB for its table cache
  ansible.builtin.copy:
    dest: /etc/systemd/system/mariadb.service.d/90-ispconfig-db.conf
    content: |
      # Managed by Ansible (ispconfig_db role): room for table_open_cache in 91-ispconfig-db.cnf
      [Service]
      LimitNOFILE={{ ispconfig_db_open_files_limit }}
    owner: root
    group: root
    mode: "0644"
  register: ispconfig_db_mariadb_limits

- name: Restart MariaDB with the new settings
  ansible.builtin.systemd_service:
    name: mariadb
    state: restarted
    daemon_reload: "{{ ispconfig_db_mariadb_limits is changed }}"
  when: ispconfig_db_mariadb_config is changed or ispconfig_db_mariadb_limits is changed
