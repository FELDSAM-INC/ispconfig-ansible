# ispconfig-rest on the panel: https://<panel>:8090, installed with its install.sh from GitHub.
ispconfig_rest_install: true
# Changing the selected release/configuration reapplies the installer, including existing installations.
ispconfig_rest_version: v1.4.2
ispconfig_rest_repository: FELDSAM-INC/ispconfig-rest
ispconfig_rest_user: ispconfig-rest
ispconfig_rest_dir: /opt/ispconfig-rest
# Force reapplying a moving branch even if its installer has not changed. Release tags are recommended.
ispconfig_rest_reconfigure: false
ispconfig_rest_port: 8090
# Extensions of ispconfig-rest, each NAME or NAME@REF (a branch or a vX.Y.Z release; default main). hosting adds the
# hosting features and the server tools below (https://github.com/FELDSAM-INC/ispconfig-rest-hosting).
ispconfig_rest_extensions: [hosting@v1.1.4]
# Public URL of the API (default https://<panel FQDN>:<port>).
ispconfig_rest_url: ""

# Server tools installed from the panel over SSH (ispconfig-rest server-tools, with the hosting extension).
# file-manager is added when the
# WHMCS public key is set, dns-catalog when ispconfig_rest_dns_catalog is true and there are DNS servers.
ispconfig_rest_server_tools: [database, web-logs, waf]
ispconfig_rest_dns_catalog: true
ispconfig_rest_php_limits: false
# WHMCS file manager: the WHMCS public SSH key (the key itself, not a path) and its outgoing addresses: IPv4 and IPv6,
# comma separated, for a WHMCS host with both (hosting extension 1.1.0).
ispconfig_rest_file_manager_key: ""
ispconfig_rest_whmcs_ip: ""
# Key root on the panel uses for the servers; its public part is authorized for root on each server, from the
# panel's address only.
ispconfig_rest_ssh_key: /root/.ssh/ispconfig-tools
